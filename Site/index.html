<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Persian Calendar — Converter & Clock</title>
  <meta name="description" content="Instant Persian (Shamsi) ↔ Gregorian date conversion and a live clock. No servers involved — everything runs in your browser." />
  <meta property="og:title" content="Persian Calendar" />
  <meta property="og:description" content="Instant Persian ↔ Gregorian date conversion." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://time.automated.ink/" />
  <link rel="icon" href="/favicon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1c22" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
  <!-- No aria-label: the visible text (فارسی / English) is the accessible name (WCAG 2.5.3). -->
  <button id="lang-toggle" type="button"></button>
  <!-- The glyph is decorative; the accessible name is set from STRINGS.settings. -->
  <button id="settings-toggle" type="button" aria-haspopup="dialog"
          aria-controls="settings-dialog"><span aria-hidden="true">⚙︎</span></button>
  <main>
    <section id="clock-section" aria-label="Clock">
      <div id="clock-mount"></div>
    </section>

    <section id="today" aria-label="Today">
      <p id="today-persian" class="date-display"></p>
      <hr class="hairline" />
      <p id="today-gregorian" class="date-display"></p>
      <p id="tehran-line" class="tehran-line" hidden></p>
    </section>

    <section id="converter" aria-label="Date converter">
      <form id="converter-form" autocomplete="off">
        <fieldset id="side-persian">
          <legend><span id="legend-persian"></span>
            <button id="p-cal" class="cal-btn" type="button" aria-expanded="false"
                    aria-controls="p-cal-pop">▦</button></legend>
          <div class="fields">
            <div class="field">
              <label for="p-y" data-str="year"></label>
              <div class="picker">
                <input id="p-y" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="4" role="combobox" aria-expanded="false"
                       aria-controls="p-y-list" aria-autocomplete="none" />
                <button id="p-y-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="p-y-list">▾</button>
                <ul id="p-y-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
            <div class="field">
              <label for="p-m" data-str="month"></label>
              <div class="picker">
                <input id="p-m" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="2" role="combobox" aria-expanded="false"
                       aria-controls="p-m-list" aria-autocomplete="none" />
                <button id="p-m-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="p-m-list">▾</button>
                <ul id="p-m-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
            <div class="field">
              <label for="p-d" data-str="day"></label>
              <div class="picker">
                <input id="p-d" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="2" role="combobox" aria-expanded="false"
                       aria-controls="p-d-list" aria-autocomplete="none" />
                <button id="p-d-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="p-d-list">▾</button>
                <ul id="p-d-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
          </div>
          <div id="p-cal-pop" class="cal-pop" hidden>
            <div class="cal-head">
              <button id="p-cal-prev" class="cal-nav" type="button">‹</button>
              <button id="p-cal-title" class="cal-title" type="button"></button>
              <button id="p-cal-next" class="cal-nav" type="button">›</button>
            </div>
            <div id="p-cal-grid" class="cal-grid" role="grid" tabindex="-1"></div>
          </div>
        </fieldset>
        <div class="exchange" aria-hidden="true">⇄</div>
        <fieldset id="side-gregorian">
          <legend><span id="legend-gregorian"></span>
            <button id="g-cal" class="cal-btn" type="button" aria-expanded="false"
                    aria-controls="g-cal-pop">▦</button></legend>
          <div class="fields">
            <div class="field">
              <label for="g-y" data-str="year"></label>
              <div class="picker">
                <input id="g-y" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="4" role="combobox" aria-expanded="false"
                       aria-controls="g-y-list" aria-autocomplete="none" />
                <button id="g-y-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="g-y-list">▾</button>
                <ul id="g-y-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
            <div class="field">
              <label for="g-m" data-str="month"></label>
              <div class="picker">
                <input id="g-m" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="2" role="combobox" aria-expanded="false"
                       aria-controls="g-m-list" aria-autocomplete="none" />
                <button id="g-m-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="g-m-list">▾</button>
                <ul id="g-m-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
            <div class="field">
              <label for="g-d" data-str="day"></label>
              <div class="picker">
                <input id="g-d" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="2" role="combobox" aria-expanded="false"
                       aria-controls="g-d-list" aria-autocomplete="none" />
                <button id="g-d-toggle" class="picker-toggle" type="button" tabindex="-1"
                        aria-expanded="false" aria-controls="g-d-list">▾</button>
                <ul id="g-d-list" class="picker-list" role="listbox" tabindex="-1" hidden></ul>
              </div>
            </div>
          </div>
          <div id="g-cal-pop" class="cal-pop" hidden>
            <div class="cal-head">
              <button id="g-cal-prev" class="cal-nav" type="button">‹</button>
              <button id="g-cal-title" class="cal-title" type="button"></button>
              <button id="g-cal-next" class="cal-nav" type="button">›</button>
            </div>
            <div id="g-cal-grid" class="cal-grid" role="grid" tabindex="-1"></div>
          </div>
        </fieldset>
      </form>
      <p id="full-date" aria-live="polite"></p>
      <div id="status-row">
        <button id="btn-today" type="button" data-str="today"></button>
        <button id="btn-copy" type="button" data-str="copy"></button>
      </div>
      <p id="converter-error" role="status" hidden></p>
    </section>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title" data-str="settings"></h2>
        <button id="settings-close" type="button" data-str="close"></button>
      </div>
      <fieldset class="settings-group">
        <legend data-str="copySection"></legend>
        <label for="set-copy-calendar" data-str="copyCalendar"></label>
        <select id="set-copy-calendar">
          <option value="persian" data-str="calPersian"></option>
          <option value="gregorian" data-str="calGregorian"></option>
          <option value="both" data-str="calBoth"></option>
        </select>
        <label for="set-copy-pattern" data-str="copyPattern"></label>
        <select id="set-copy-pattern">
          <option value="yyyy-mm-dd">yyyy-mm-dd</option>
          <option value="yyyy/mm/dd">yyyy/mm/dd</option>
          <option value="dd.mm.yyyy">dd.mm.yyyy</option>
          <option value="sentence" data-str="patternSentence"></option>
          <option value="custom" data-str="patternCustom"></option>
        </select>
        <div id="set-copy-custom-row" class="settings-custom" hidden>
          <label for="set-copy-custom" data-str="patternCustomLabel"></label>
          <input id="set-copy-custom" type="text" maxlength="64" dir="ltr"
                 autocomplete="off" spellcheck="false" aria-describedby="set-copy-hint" />
          <p id="set-copy-hint" class="settings-hint" data-str="patternHint"></p>
        </div>
        <label for="set-copy-digits" data-str="copyDigits"></label>
        <select id="set-copy-digits">
          <option value="latin" data-str="digitsLatin"></option>
          <option value="persian" data-str="digitsPersian"></option>
        </select>
        <p class="settings-preview"><span data-str="copyPreview"></span>
          <output id="set-copy-preview" for="set-copy-calendar set-copy-pattern set-copy-custom set-copy-digits"></output></p>
      </fieldset>
    </dialog>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
