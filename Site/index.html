<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Persian Calendar — Converter & Clock</title>
  <meta name="description" content="Instant Persian (Shamsi) ↔ Gregorian date conversion and a live clock. No servers involved — everything runs in your browser." />
  <meta property="og:title" content="Persian Calendar" />
  <meta property="og:description" content="Instant Persian ↔ Gregorian date conversion." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://time.automated.ink/" />
  <link rel="icon" href="/favicon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1c22" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
  <!-- No aria-label: the visible text (فارسی / English) is the accessible name (WCAG 2.5.3). -->
  <button id="lang-toggle" type="button"></button>
  <main>
    <section id="clock-section" aria-label="Clock">
      <div id="clock-mount"></div>
    </section>

    <section id="today" aria-label="Today">
      <p id="today-persian" class="date-display"></p>
      <hr class="hairline" />
      <p id="today-gregorian" class="date-display"></p>
      <p id="tehran-line" class="tehran-line" hidden></p>
    </section>

    <section id="converter" aria-label="Date converter">
      <form id="converter-form" autocomplete="off">
        <fieldset id="side-persian">
          <legend id="legend-persian"></legend>
          <div class="fields">
            <label><span data-str="year"></span>
              <input id="p-y" type="text" inputmode="numeric" /></label>
            <label><span data-str="month"></span>
              <select id="p-m"></select></label>
            <label><span data-str="day"></span>
              <input id="p-d" type="text" inputmode="numeric" /></label>
          </div>
        </fieldset>
        <div class="exchange" aria-hidden="true">⇄</div>
        <fieldset id="side-gregorian">
          <legend id="legend-gregorian"></legend>
          <div class="fields">
            <label><span data-str="year"></span>
              <input id="g-y" type="text" inputmode="numeric" /></label>
            <label><span data-str="month"></span>
              <select id="g-m"></select></label>
            <label><span data-str="day"></span>
              <input id="g-d" type="text" inputmode="numeric" /></label>
          </div>
        </fieldset>
      </form>
      <div id="status-row">
        <button id="btn-today" type="button" data-str="today"></button>
        <span id="weekday"></span>
        <button id="btn-copy" type="button" data-str="copy"></button>
      </div>
      <p id="converter-error" role="status" hidden></p>
    </section>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
