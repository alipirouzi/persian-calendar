server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Server-level fallback: nginx-generated responses that never reach a
    # location block (e.g. 400/414) still carry the security headers.
    # Each location re-includes this file because add_header at a deeper level
    # discards inherited headers.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 'ok';
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # No `always`: a 404 for a missing hashed asset must not be cached
        # immutably for a year. Security headers keep `always` (see the include).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /quotes.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
